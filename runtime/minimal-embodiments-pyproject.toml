[project]
name = "embodiments"
version = "0.4.0+robodojo.sim"
description = "Simulation-only embodiment runtime for the RoboDojo QwenPaw deployment"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {embodiments = "."}
packages = ["embodiments", "embodiments.runtime"]

