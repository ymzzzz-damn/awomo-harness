apiVersion: batch/v1
kind: Job
metadata:
  name: qwenpaw-sim-bootstrap
  namespace: dreamzero-training
  labels:
    app.kubernetes.io/name: qwenpaw-sim-harness
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 0
  # First install writes many Python packages to the shared filesystem and can
  # be metadata-bound; allow enough time for the one-off build.
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwenpaw-sim-harness
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: registry-secret
      # This namespace has many Services. Disabling auto-generated service
      # environment variables prevents execve() from exceeding ARG_MAX.
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: "192.168.48.153"
        node.kubernetes.io/cce-instance-type: bcc.lgn7c.c180m890.8gpu
      tolerations:
        - key: gpu-type
          operator: Equal
          value: "5090"
          effect: NoSchedule
      containers:
        - name: bootstrap
          image: registry.d-robotics.cc/auwomo-auwomo/robodojo-tswam-full:20260901-f2@sha256:834a60f7a9e36254b5ac8fc1ec4689b19d9e4eb413836e65812e4047940499a3
          imagePullPolicy: IfNotPresent
          # Do not start a login shell: the RoboDojo image's large login-time
          # environment can exceed Linux ARG_MAX before the script begins.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              test -f "${RELEASE_ROOT}/SOURCE_MANIFEST.json"
              echo "bootstrap node=${NODE_NAME} (5090 node class; harness install requests 0 GPU)"
              if [[ ! -x "${RELEASE_ROOT}/runtime/venv/bin/python" ]]; then
                python3 -m venv "${RELEASE_ROOT}/runtime/venv"
              fi
              "${RELEASE_ROOT}/runtime/venv/bin/python" -m pip install \
                -r "${RELEASE_ROOT}/runtime/constraints.txt"
              # FastMCP 3/4 used a package directory at this path, while the
              # pinned 2.14.x line uses oauth_proxy.py. pip can leave the old
              # directory behind during a downgrade, and Python would prefer
              # it over the compatible module. Preserve it outside the venv.
              for stale_fastmcp_rel in \
                fastmcp/server/auth/oauth_proxy \
                fastmcp/client/transports; do
                stale_fastmcp_dir="${RELEASE_ROOT}/runtime/venv/lib/python3.11/site-packages/${stale_fastmcp_rel}"
                if [[ -d "${stale_fastmcp_dir}" ]]; then
                  stale_fastmcp_name="${stale_fastmcp_rel//\//-}"
                  stale_fastmcp_backup="${RELEASE_ROOT}/runtime/compat-backup/${stale_fastmcp_name}-directory-$(date -u +%Y%m%dT%H%M%SZ)"
                  install -d "$(dirname "${stale_fastmcp_backup}")"
                  mv "${stale_fastmcp_dir}" "${stale_fastmcp_backup}"
                fi
              done
              if ! "${RELEASE_ROOT}/runtime/venv/bin/python" -c 'import qwenpaw, embodiments'; then
                "${RELEASE_ROOT}/runtime/venv/bin/python" -m pip install --upgrade pip setuptools wheel
                "${RELEASE_ROOT}/runtime/venv/bin/python" -m pip install -e "${RELEASE_ROOT}/source/embodiments"
                "${RELEASE_ROOT}/runtime/venv/bin/python" -m pip install \
                  -c "${RELEASE_ROOT}/runtime/constraints.txt" \
                  -e "${RELEASE_ROOT}/source"
              fi
              "${RELEASE_ROOT}/runtime/venv/bin/python" "${RELEASE_ROOT}/runtime/bootstrap_runtime.py" \
                --release-root "${RELEASE_ROOT}" \
                --bridge-url "${ROBODOJO_SIM_BRIDGE_URL}" \
                --check-api \
                --receipt "${RELEASE_ROOT}/receipts/bootstrap.json"
              "${RELEASE_ROOT}/runtime/venv/bin/python" -c \
                'import qwenpaw.app._app; print("qwenpaw app import ok")'
              "${RELEASE_ROOT}/runtime/venv/bin/python" -c \
                'import fastmcp; from reme.reme_light import ReMeLight; print("memory/MCP imports ok")'
          env:
            - name: RELEASE_ROOT
              value: __RELEASE_ROOT__
            - name: ROBODOJO_SIM_BRIDGE_URL
              value: http://127.0.0.1:8098
            - name: QWENPAW_MODEL
              value: gpt-6-astra
            - name: QWENPAW_WORKING_DIR
              value: /runtime/qwenpaw
            - name: QWENPAW_SECRET_DIR
              value: /runtime/qwenpaw.secret
            - name: QWENPAW_RUNNING_IN_CONTAINER
              value: "true"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: qwenpaw-harness-api
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: shared-data
              mountPath: /mnt/auwomo-data
            - name: runtime
              mountPath: /runtime
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shared-data
          hostPath:
            path: /mnt/auwomo-data
            type: Directory
        - name: runtime
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

