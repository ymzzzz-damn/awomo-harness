version: '3.8'

volumes:
  awomopaw-data:
    name: awomopaw-data
  awomopaw-secrets:
    name: awomopaw-secrets
  awomopaw-backups:
    name: awomopaw-backups

services:
  awomopaw:
    build: .
    image: awomopaw:local
    container_name: awomopaw
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    # environment:
    #   - AWOMOPAW_AUTH_ENABLED=true
    #   - AWOMOPAW_AUTH_USERNAME=admin
    #   - AWOMOPAW_AUTH_PASSWORD=yourpassword
    volumes:
      - awomopaw-data:/app/working
      - awomopaw-secrets:/app/working.secret
      - awomopaw-backups:/app/working.backups
